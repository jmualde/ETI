<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar vehículo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="disenio.css">
</head>

<body>

    <div class="container-fluid">
        <div class="tarjeta">

            <div class="contenido">

                <h2></h2>

                <h4 class="titulo">
                    Ingrese los datos del vehículo
                </h4>

                <form action="guardar_auto.php" method="POST">

                    <!-- MARCA -->
                    <div class="mb-3">
                        <label for="marca" class="form-label gris">
                            Marca
                        </label>

                        <select
                            class="campo"
                            id="marca"
                            name="marca"
                            required
                        >
                            <option value="">Seleccione una marca</option>
                        </select>
                    </div>


                    <!-- MODELO -->
                    <div class="mb-3">

                        <label for="modelo" class="form-label gris">
                            Modelo
                        </label>

                        <div class="marca-color">

                            <select
                                class="campo"
                                id="modelo"
                                name="modelo"
                                required
                            >
                                <option value="">
                                    Primero seleccione marca
                                </option>
                            </select>

                            <input
                                type="color"
                                class="campoColor"
                                id="color"
                                name="color"
                            >

                        </div>

                    </div>


                    <!-- BOTÓN -->
                    <button
                        type="submit"
                        class="botonRegistra"
                    >
                        Registre vehículo
                    </button>

                </form>

            </div>

        </div>
    </div>


    <!-- JAVASCRIPT -->
    <script>

        const selectMarca = document.getElementById("marca");

        fetch("obtener_marcas.php")
            .then(response => {

                if (!response.ok) {
                    throw new Error("Error HTTP: " + response.status);
                }

                return response.json();
            })

            .then(data => {

                console.log("Datos recibidos:", data);

                selectMarca.innerHTML = "";

                const opcionInicial = document.createElement("option");

                opcionInicial.value = "";
                opcionInicial.textContent = "Seleccione una marca";
                opcionInicial.disabled = true;
                opcionInicial.selected = true;

                selectMarca.appendChild(opcionInicial);


                data.data.forEach(marca => {

                    const opcion = document.createElement("option");

                    opcion.value = marca.name;
                    opcion.textContent = marca.name;

                    selectMarca.appendChild(opcion);

                });

            })

            .catch(error => {

                console.error(
                    "Error al cargar las marcas:",
                    error
                );

                selectMarca.innerHTML = "";

                const opcionError = document.createElement("option");

                opcionError.value = "";
                opcionError.textContent =
                    "No se pudieron cargar las marcas";

                selectMarca.appendChild(opcionError);

            });


        const selectModelo = document.getElementById("modelo");


        selectMarca.addEventListener("change", function () {

            const marcaSeleccionada = this.value;

            selectModelo.innerHTML = "";

            const cargando = document.createElement("option");

            cargando.value = "";
            cargando.textContent = "Cargando modelos...";

            selectModelo.appendChild(cargando);


            fetch(
                "obtener_modelos.php?marca=" +
                encodeURIComponent(marcaSeleccionada)
            )

                .then(response => {

                    if (!response.ok) {
                        throw new Error(
                            "Error HTTP: " + response.status
                        );
                    }

                    return response.json();
                })

                .then(data => {

                    console.log("Modelos recibidos:", data);

                    selectModelo.innerHTML = "";

                    const opcionInicial =
                        document.createElement("option");

                    opcionInicial.value = "";
                    opcionInicial.textContent =
                        "Seleccione un modelo";

                    opcionInicial.disabled = true;
                    opcionInicial.selected = true;

                    selectModelo.appendChild(opcionInicial);


                    data.data.forEach(modelo => {

                        const opcion =
                            document.createElement("option");

                        opcion.value = modelo.name;
                        opcion.textContent = modelo.name;

                        selectModelo.appendChild(opcion);

                    });

                })

                .catch(error => {

                    console.error(
                        "Error al cargar los modelos:",
                        error
                    );

                    selectModelo.innerHTML = "";

                    const opcionError =
                        document.createElement("option");

                    opcionError.value = "";
                    opcionError.textContent =
                        "No se pudieron cargar los modelos";

                    selectModelo.appendChild(opcionError);

                });

        });

    </script>

</body>

</html>
