
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar vehículo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="disenio.css?v=20260912">
</head>

<body>
    <div class="container-fluid p-0">

    <nav class="tarjetaArriba">

        <a href="principal.html">
            <h6 class="textoBlanco">Página Principal</h6>
        </a>

        <a href="registra_auto.html">
            <h6 class="textoBlanco">Registrar vehículo</h6>
        </a>

        <a href="ocupar_lugar.html">
            <h6 class="textoBlanco">Ocupar lugar</h6>
        </a>

        <a href="cuenta.php">
            <h6 class="textoBlanco">Cuenta</h6>
        </a>

    </nav>
    <br><br><br><br>
    
         <center>
                <h1 >Ingrese los datos del vehículo  </h1>
            </center>
            <br><br><br>
            <div class="row justify-content-center">

                   
            <div class="col-12 col-md-6 col-lg-4">

            <form action="guardar_auto.php" method="POST">

                <!-- MARCA -->

                <div class="mb-3">

                    <label for="marca" class="textoBlanco">
                        Marca
                    </label>
                    <select
                        class="campo form-control"
                        id="marca"
                        name="marca"
                        required>

                        <option value="">
                            Seleccione una marca
                        </option>

                    </select>

                </div>


                <!-- MODELO + COLOR -->

                <div class="mb-3">

                    <label for="modelo" class="textoBlanco">
                        Modelo
                    </label>

                    <div class="marca-color">

                        <select
                            class="campo form-control"
                            id="modelo"
                            name="modelo"
                            required>

                            <option value="">
                                Primero seleccione marca
                            </option>

                        </select>


                        <input
                            type="color"
                            class="campoColor"
                            id="color"
                            name="color">

                    </div>

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="botonRegistra">

                    Registrar vehículo

                </button>

            </form>
                        </div>
                </div>
        </div>
</div>

    <!-- JAVASCRIPT -->

    <script>

        const selectMarca =
            document.getElementById("marca");


        /* CARGAR MARCAS */

        fetch("obtener_marcas.php")

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Error HTTP: " + response.status
                    );

                }

                return response.json();

            })

            .then(data => {

                console.log(
                    "Datos recibidos:",
                    data
                );


                selectMarca.innerHTML = "";


                const opcionInicial =
                    document.createElement("option");


                opcionInicial.value = "";

                opcionInicial.textContent =
                    "Seleccione una marca";

                opcionInicial.disabled = true;

                opcionInicial.selected = true;


                selectMarca.appendChild(
                    opcionInicial
                );


                data.data.forEach(marca => {

                    const opcion =
                        document.createElement("option");


                    opcion.value =
                        marca.name;

                    opcion.textContent =
                        marca.name;


                    selectMarca.appendChild(
                        opcion
                    );

                });

            })


            .catch(error => {

                console.error(
                    "Error al cargar las marcas:",
                    error
                );


                selectMarca.innerHTML = "";


                const opcionError =
                    document.createElement("option");


                opcionError.value = "";

                opcionError.textContent =
                    "No se pudieron cargar las marcas";


                selectMarca.appendChild(
                    opcionError
                );

            });


        const selectModelo =
            document.getElementById("modelo");


        /* CARGAR MODELOS */

        selectMarca.addEventListener(
            "change",
            function () {

                const marcaSeleccionada =
                    this.value;


                selectModelo.innerHTML = "";


                const cargando =
                    document.createElement("option");


                cargando.value = "";

                cargando.textContent =
                    "Cargando modelos...";


                selectModelo.appendChild(
                    cargando
                );


                fetch(
                    "obtener_modelos.php?marca=" +
                    encodeURIComponent(
                        marcaSeleccionada
                    )
                )

                    .then(response => {

                        if (!response.ok) {

                            throw new Error(
                                "Error HTTP: " +
                                response.status
                            );

                        }

                        return response.json();

                    })

                    .then(data => {

                        console.log(
                            "Modelos recibidos:",
                            data
                        );


                        selectModelo.innerHTML =
                            "";


                        const opcionInicial =
                            document.createElement(
                                "option"
                            );


                        opcionInicial.value =
                            "";

                        opcionInicial.textContent =
                            "Seleccione un modelo";

                        opcionInicial.disabled =
                            true;

                        opcionInicial.selected =
                            true;


                        selectModelo.appendChild(
                            opcionInicial
                        );


                        data.data.forEach(
                            modelo => {

                                const opcion =
                                    document.createElement(
                                        "option"
                                    );


                                opcion.value =
                                    modelo.name;

                                opcion.textContent =
                                    modelo.name;


                                selectModelo.appendChild(
                                    opcion
                                );

                            }
                        );

                    })


                    .catch(error => {

                        console.error(
                            "Error al cargar los modelos:",
                            error
                        );


                        selectModelo.innerHTML =
                            "";


                        const opcionError =
                            document.createElement(
                                "option"
                            );


                        opcionError.value =
                            "";

                        opcionError.textContent =
                            "No se pudieron cargar los modelos";


                        selectModelo.appendChild(
                            opcionError
                        );

                    });

            }
        );

    </script>

</body>

</html>
