<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
</head>

<style>
    body {
        background-color: #0e1113;
        color: white;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: 'Inter', sans-serif;
    }

    .container {
        width: 100%;
        max-width: 1200px;
    }

    .row {
        margin: 0;
    }

    .tarjeta {
        width: min(100%, 650px);
        background-color: #161a1d;
        border-radius: 10px;
        box-shadow: 1px 1px 10px rgb(83, 83, 83);
        border: 1px solid darkslategray;
        padding: clamp(25px, 5vw, 50px);
        margin: 0 auto;
        min-height: 350px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    form {
        width: 100%;
    }

    .registrar {
        width: 100%;
    }

    h5 {
        margin: 0 0 20px;
        font-size: clamp(1rem, 2vw, 1.5rem);
        line-height: 1.5;
        text-align: center;
    }

    .form-label {
        display: block;
        margin-bottom: 8px;
    }

    .botonRegistra {
        width: min(100%, 550px);
        height: 45px;
        border-radius: 50px;
        background-color: white;
        font-weight: bold;
        border: none;
        display: block;
        margin: 0 auto;
    }

    .botonYaTengoCuenta {
        width: min(100%, 550px);
        height: 45px;
        border-radius: 50px;
        background: transparent;
        color: white;
        font-weight: bold;
        border: 2px solid white;
    }

    .gris {
        color: #C7D1DB;
        font-weight: bold;
        transition: 0.5s;
    }

    .azul {
        color: #C7D1DB;
        font-weight: bold;
    }

    .campo {
        display: flex;
        background: #0e1113;
        border: 1px solid gray;
        border-radius: 10px;
        width: min(100%, 550px);
        height: 45px;
        color: white;
        padding: 0 15px;
        margin-bottom: 20px;
    }

    .campo:focus {
        border-color: white;
        outline: none;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 768px) {
        body {
            padding: 15px;
        }

        .tarjeta {
            width: 100%;
            min-height: auto;
            padding: 25px 18px;
        }

        .campo,
        .botonRegistra {
            width: 100%;
        }
    }

    @media (max-width: 480px) {
        h5 {
            font-size: 1rem;
        }

        .tarjeta {
            border-radius: 12px;
        }

        .campo {
            height: 42px;
            font-size: 14px;
        }

        .botonRegistra {
            height: 42px;
        }
    }
</style>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                
                <div class="tarjeta">
                    <form action="mailProcesa.php" method="POST">
                        <div class="registrar">
                        <h5><center>
                            Ingrese su correo electrónico para recuperar su contraseña
                            </center>
                        </h5>
                        <br>
                        <label class="form-label">E-mail</label>
                        <br>
                        <input type="email" class="campo form-control " id="mailRecuperacion" name="mailRecuperacion" placeholder="E-mail">
                        <br>
                        <button type="submit" class="botonRegistra">Enviar</button>
                    </form>
                </div>
                
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
